apiVersion: v1
kind: Namespace
metadata:
  name: devops-hello
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: devops-hello
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  PROMETHEUS_EXPORT_ENABLED: "true"
  H2_CONSOLE_ENABLED: "false"
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_APP: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-catalogue
  namespace: devops-hello
  labels:
    app: book-catalogue
    tier: backend
    env: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: book-catalogue
  template:
    metadata:
      labels:
        app: book-catalogue
        tier: backend
        env: prod
    spec:
      containers:
        - name: book-catalogue
          image: devops-hello:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: book-catalogue-service
  namespace: devops-hello
  labels:
    app: book-catalogue
spec:
  type: ClusterIP
  selector:
    app: book-catalogue
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: book-catalogue-monitor
  namespace: devops-hello
  labels:
    app: book-catalogue
    release: prometheus
spec:
  selector:
    matchLabels:
      app: book-catalogue
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - devops-hello
