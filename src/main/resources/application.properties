# ============================================
# Spring Boot Application Properties
# ============================================

spring.application.name=devops-hello
server.port=${SERVER_PORT:8080}

# --------------------------------------------
# Profiles
#   dev    - local development (default)
#   staging - pre-production environment
#   prod   - production environment
# --------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --------------------------------------------
# DataSource — H2 in-memory (swap to Postgres in prod)
# --------------------------------------------
spring.datasource.url=jdbc:h2:mem:bookdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --------------------------------------------
# JPA / Hibernate
# --------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------
# H2 Console (disabled in prod)
# --------------------------------------------
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# --------------------------------------------
# Actuator — Health, Metrics, Info endpoints
# --------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.info.enabled=true
management.metrics.enable.all=true
management.metrics.export.prometheus.enabled=${PROMETHEUS_EXPORT_ENABLED:true}

# --------------------------------------------
# Info endpoint — build metadata
# --------------------------------------------
info.app.name=${spring.application.name}
info.app.description=YuvaIntern DevOps Internship - Book Catalogue REST API
info.app.version=${project.version}
info.app.java-version=${java.version}

# --------------------------------------------
# Logging
# --------------------------------------------
logging.level.root=INFO
logging.level.com.example.devopshello=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=${LOG_FILE:${java.io.tmpdir}/devops-hello.log}
logging.file.max-size=10MB
logging.file.max-history=30

# --------------------------------------------
# Server — Timeouts and keep-alive
# --------------------------------------------
server.servlet.context-path=/
server.error.include-message=never
server.error.include-binding-errors=never
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %{User-Agent}i "%{Referer}i" %D
