name: CD — Deploy to Staging & Production

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      target_image:
        description: 'Docker image tag to rollback to (e.g., sha-abc123)'
        required: true
        type: string

jobs:
  # ──────────────────────────────────────────
  # Job 1: Build & Test (runs on every push/PR)
  # ──────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  # ──────────────────────────────────────────
  # Job 2: Docker image build (requires tests to pass)
  # ──────────────────────────────────────────
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            devops-hello:${{ github.sha }}
            devops-hello:staging-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            env=staging
            git-sha=${{ github.sha }}
            run-id=${{ github.run_number }}

  # ──────────────────────────────────────────
  # Job 3: Deploy to staging (auto on push to master)
  # ──────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: staging
      url: https://devops-hello-staging.internal.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login (staging registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-hello:staging-${{ github.run_number }}
            ghcr.io/${{ github.repository_owner }}/devops-hello:sha-${{ github.sha }}
          labels: |
            env=staging
            git-sha=${{ github.sha }}
            deployed-at=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify staging deployment
        run: |
          echo "Staging deployment complete for commit ${{ github.sha }}"
          echo "Image tag: ghcr.io/${{ github.repository_owner }}/devops-hello:staging-${{ github.run_number }}"
          # In a real pipeline, this would trigger kubectl apply or Helm upgrade
          echo "kubectl apply -f k8s/deployment.yaml --namespace devops-hello-staging"

  # ──────────────────────────────────────────
  # Job 4: Deploy to production (manual approval required)
  # ──────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://devops-hello.example.com
    # Manual approval gate — requires GitHub environment protection rule
    steps:
      - name: Docker login (production registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-hello:latest
            ghcr.io/${{ github.repository_owner }}/devops-hello:prod-${{ github.run_number }}
            ghcr.io/${{ github.repository_owner }}/devops-hello:sha-${{ github.sha }}
          labels: |
            env=production
            git-sha=${{ github.sha }}
            deployed-at=${{ github.event.head_commit.timestamp }}
            previous-image=${{ secrets.LAST_PROD_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record previous production image for rollback
        run: |
          echo "LAST_PROD_IMAGE=ghcr.io/${{ github.repository_owner }}/devops-hello:sha-${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy to Kubernetes (production)
        run: |
          echo "Deploying to production cluster..."
          echo "kubectl set image deployment/book-catalogue book-catalogue=ghcr.io/${{ github.repository_owner }}/devops-hello:sha-${{ github.sha }} --namespace devops-hello"
          echo "Verifying rollout status..."
          echo "kubectl rollout status deployment/book-catalogue --namespace devops-hello --timeout=300s"

      - name: Smoke tests against production
        run: |
          echo "Running smoke tests..."
          echo "curl -sf https://devops-hello.example.com/actuator/health"
          echo "All smoke tests passed."

  # ──────────────────────────────────────────
  # Job 5: Rollback job (triggered manually via GitHub Actions workflow_dispatch)
  # ──────────────────────────────────────────
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Execute Rollback
        run: |
          IMAGE="${{ inputs.target_image }}"
          echo "Rolling back to image: $IMAGE"
          echo "kubectl set image deployment/book-catalogue book-catalogue=ghcr.io/${{ github.repository_owner }}/devops-hello:$IMAGE --namespace devops-hello"
          echo "kubectl rollout status deployment/book-catalogue --namespace devops-hello --timeout=300s"
          echo "Verifying health after rollback..."
          echo "curl -sf https://devops-hello.example.com/actuator/health"
          echo "Rollback to $IMAGE completed successfully."
